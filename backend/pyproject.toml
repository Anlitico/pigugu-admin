[project]
name = "pigugu-admin"
version = "0.1.0"
description = "Pigugu internal admin console — query voice.turns conversation logs"
requires-python = ">=3.13"
dependencies = [
    "asynch>=0.3",
    "boto3>=1.34",
    "fastapi>=0.111.0",
    "pydantic-settings>=2.2.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "routers"]

[tool.ruff]
line-length = 100
target-version = "py313"
lint.select = ["E", "F", "I", "UP"]
lint.ignore = ["E501"]
lint.isort.known-first-party = ["core", "routers"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
