# ServiceAccount for pigugu-admin to presign S3 audio URLs via IRSA
# (IAM Roles for Service Accounts).
#
# The role pigugu-admin-audio-reader was created with a trust policy
# restricting to the cluster OIDC provider + this SA, and an inline
# policy with s3:GetObject/GetObjectAttributes on the audio bucket.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pigugu-admin-sa
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::537557168531:role/pigugu-admin-audio-reader"
